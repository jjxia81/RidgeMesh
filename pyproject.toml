[build-system]
requires = ["scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

[project]
name = "ridgemesh"
version = "0.1.0"
description = "Strong height-ridge and valley extraction on MTet grids"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "RidgeMesh contributors"}]
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
torch = ["torch>=2.1"]
plot = ["matplotlib>=3.7"]

[tool.scikit-build]
cmake.build-type = "Release"
wheel.packages = ["python/ridgemesh"]
